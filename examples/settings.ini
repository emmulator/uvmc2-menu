; menu/settings.ini: optional, and never made by the menu. menu = off starts the cartridge's own menu at the next power-on,
; so you can switch this menu off from a PC; starting MENU.um2 from the firmware's Browse turns it back on, and sets this line
; back to on. No file, or no line, means on.
menu = on        ; on / off
; new = 10 is how many files the top-level NEW list shows (1 to 20); 10 if the line is missing.
new = 10
