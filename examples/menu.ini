; examples/menu.ini: one person's layout, trimmed, to copy from. Not a default: the menu lists no card games by itself, and
; where yours go is your decision. Copy the parts you want into your card's menu/menu.ini (read last, so it wins), change the
; names to your own files, and see README "Making the menu yours". Beside this file: settings.ini (turns the menu off from a
; PC), favorites.ini (what button 3 writes) and e-srg.ini (notes for one game, kept in a file of its own).
;
; The game names and files are real ones from the author's card (UVMC2 ports, Vectrex homebrew); yours will differ.

; ---- 1. folder rules: every file in one card folder, in one menu folder ----------------------------------------------
; Nothing on the card is listed until a rule or entry says so. A rule lists the files of ONE folder (it does not look in
; subfolders; "." is the card's root). files = says which kinds: only names that end in one of those extensions are listed,
; and each is started by its own path.
[CARD FILES]
category = HOMEBREW
folder   = .
files    = um2 bin vec

[PORTS]
category = UVMC2
folder   = PORTS/UM2
files    = um2

; Built-in games the firmware puts in no folder of its own. Without this rule they go in HOMEBREW anyway.
[BUILT-IN]
folder   = @fw
image    = @fw
category = HOMEBREW

; ---- 2. file sections: change how a file a rule found is shown ---------------------------------------------------------
; A file = section needs a rule that lists the file (above): it moves, renames, annotates or hides it, and lists nothing by
; itself. The section name is the title unless title = says otherwise. text lines show under the list.
[VECTOR KONG]
file     = dkong.um2
category = ARCADE
text     = ARCADE: NINTENDO 1981 (DONKEY KONG)
text     = PORT BY DANI FERRER
text     = VECTORISED BY 10YARD
text     = ROM SET .ROMS/DKONG.ZIP

[EXPLODING FIST]
file     = FIST.um2
category = C64

; A path in a subfolder works the same, if a rule lists that folder.
[ENDURO]
file     = PORTS/UM2/enduro.um2
category = ATARI 2600
also     = FAVORITES
text     = ATARI 2600: ACTIVISION 1983
text     = CONVERSION BY NIGEL HARRISON

; category = A / B makes a folder B inside A. also = lists a second copy somewhere else.
[MINE STORM ARCADE]
file     = MStormArcade.bin
category = MINESTORM

; ---- 3. entries: list ONE file, from any folder, with no rule ----------------------------------------------------------
; image = names the file; the entry is hidden if the file is missing. needs = another file it must have (a ROM set).
[MHAVOC]
category = ARCADE / ATARI
image    = mhavoc.um2
needs    = roms/mhavoc.zip

; A program in its own folder, with notes:
[VR REPLAY]
category = DEMOS
image    = VRREPLAY/vrreplay.um2
text     = VIRTUA RACING RACE AS VECTORS
text     = NEEDS VRREPLAY/SCENES.BIN

; ---- 4. hiding ---------------------------------------------------------------------------------------------------------
; A hidden file or built-in stays out of the menu but still shows in BROWSE SD CARD (and not in its unmapped view: hiding
; is a decision about it).
; A card file that is also a built-in game:
[HIDE ZSB]
file = ZSB.bin
hide = 1
; A cheat or autofire version:
[HIDE WORMHOLE AUTOFIRE]
file = Wormhole_with_autofire_by_NigelH.vec
hide = 1
; A built-in game (the name as the firmware lists it):
[VECTORCLOCK]
file = @fw/VectorClock
hide = 1
; A whole folder of built-ins: the section name is the folder's name, and what is only in it goes with it.
[LIGHTPEN]
hide = 1

; ---- 5. built-in games: move or rename -------------------------------------------------------------------------------
[RIP OFF]
file     = @fw/Rip Off
category = ORIGINAL

; ---- 6. a title, control lines, and the order inside a folder ----------------------------------------------------------
; title = shows another name than the section's. control = lines come up with the notes on button 2.
[STAR CASTLE]
file     = starcas.um2
category = ARCADE
title    = STAR CASTLE (AAE)
control  = BUTTON 1 FIRE
control  = BUTTON 2 SHIELD
; A folder with order = listed keeps the order its entries are written in, instead of sorting them by title.
[DEMOS]
order = listed

; ---- 7. category order -----------------------------------------------------------------------------------------------
; Top level folders and entries sort by title, SYSTEM last. A category listed in a comment is only a reminder; any
; category = line makes its folder.
; Top level: ORIGINAL, MINESTORM, HOMEBREW, ARCADE, UVMC2, ATARI 2600, C64, NES, INTELLIVISION, VIRTUAL BOY, APPS, TOOLS, SYSTEM.
