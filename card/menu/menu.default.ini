; menu.default.ini: the menu as it comes with the package. DO NOT EDIT: an update replaces it.
; Put changes in any other .ini file in this folder; an update never touches those. They are read in alphabetical
; order and menu.ini is read last, so later files win. In short:
;
;   change an entry    [MY GAME]            move a found file   [STAR WARS]
;                        text = A NOTE                            file = Star Wars.um2
;   list it elsewhere    also = FAVORITES                         category = ARCADE
;   hide it, show it     hide = 1
;   a built-in game    [RIP OFF]            the unfiled built-ins   [BUILT-IN]
;                        file = @fw/Rip Off                          folder = @fw
;                        category = ORIGINAL                         image = @fw
;                                                                    category = HOMEBREW
;   add your own       [MHAVOC]
;                        category = ARCADE
;                        image = mhavoc.um2
;                        needs = roms/mhavoc.zip
;
; Lines: image, file, folder + files, category (A / B makes a folder), also, needs, title, text, control, hide,
; order = listed. Paths start at the root of the card. text lines show under the list; Button 2 shows control lines.
; A found file is one a folder rule lists (folder + files, README "Making the menu yours"): this file has
; none, so card games are listed only by your own entries and folder rules. BROWSE SD CARD reaches every file.

[BROWSE SD CARD]
category = /
image    = @browse
text     = EVERY FOLDER ON THE CARD, AND THE
text     = UM2, BIN AND VEC FILES IN IT.

; built-in games with no category in the firmware's game list, put where the firmware's own menu shows them
; (any other uncategorized built-in goes to HOMEBREW)
